# RabbitMQ Configuration with mTLS (Mutual TLS)
# ===============================================
# This configuration enables mutual TLS authentication where:
# - Server authenticates itself to clients with server certificate
# - Clients must authenticate with client certificates
# - Both sides verify each other's certificates using CA certificate

# Default user credentials
default_user = guest
default_pass = guest

# ====== AMQP Protocol Configuration ======
listeners.tcp = none

# Disable plain TCP - only allow secure mTLS connections
# listeners.tcp.default = 5672

# Enable SSL listener on port 5671 (standard AMQP over TLS)
listeners.ssl.default = 5671

# ====== SSL/TLS Configuration ======

# SSL listener options
ssl_options.cacertfile = /etc/rabbitmq/certs/ca_certificate.pem
ssl_options.certfile   = /etc/rabbitmq/certs/server_certificate.pem
ssl_options.keyfile    = /etc/rabbitmq/certs/server_key.pem

# ====== mTLS Configuration ======
# Mutual TLS requires both server and client to authenticate each other

# verify_peer: Verify that the client certificate is valid
ssl_options.verify = verify_peer

# fail_if_no_peer_cert: Reject clients that don't provide a certificate
# Set to 'true' for strict mTLS; 'false' for optional client certs
ssl_options.fail_if_no_peer_cert = true

# depth: Maximum depth of the certificate chain to verify
# 2 allows for intermediate CAs between the root CA and client cert
ssl_options.depth = 2

# ====== TLS Version & Cipher Configuration ======

# Restrict to TLS 1.2 and above (not TLS 1.0, 1.1)
ssl_options.versions.1 = tlsv1.2
ssl_options.versions.2 = tlsv1.3

# Prefer server's cipher suite order
ssl_options.honor_cipher_order = true

# Prefer server's ECC curves order
ssl_options.honor_ecc_order = true

# ====== Management Plugin Configuration ======
# Enable RabbitMQ Management UI (optional, for monitoring)

# management.load_definitions = /etc/rabbitmq/definitions.json

# RabbitMQ Management Plugin
management.tcp.port = 15672
management.tcp.ip   = 0.0.0.0

# Note: Management UI uses HTTP (not HTTPS) in this learning setup
# In production, you should configure HTTPS for management UI as well

# ====== Additional Settings ======

# Channel and connection settings
channel_max = 2048
connection_max = infinity
heartbeat = 60

# Memory settings
vm_memory_high_watermark.relative = 0.6

# Log settings
log.console = true
log.console.level = info
log.file.level = info
